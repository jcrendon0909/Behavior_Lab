<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Behavior Lab Governance</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">
  
  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center space-x-3">
      <span class="text-xl font-extrabold tracking-wider bg-gradient-to-r from-teal-400 to-blue-500 bg-clip-text text-transparent">BEHAVIOR LAB</span>
    </div>
    <div class="flex items-center space-x-4">
      <span id="userEmail" class="text-sm text-slate-400"></span>
      <button id="logoutBtn" class="text-sm text-rose-400 hover:text-rose-300 font-semibold transition">Cerrar Sesión</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    <div class="mb-8 flex justify-between items-end">
      <div>
        <h1 class="text-3xl font-bold mb-2">Panel de Gobernanza</h1>
        <p class="text-slate-400">Gestiona el inventario de IA y el riesgo de tu organización.</p>
      </div>
      <button id="btnGeneratePolicy" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold py-2 px-6 rounded-lg transition shadow-lg shadow-blue-500/20 flex items-center gap-2">
        <span>📄</span> Generar Política de IA
      </button>
    </div>

    <!-- Navigation -->
    <div class="flex space-x-4 mb-6 border-b border-slate-800 pb-2">
      <button class="text-teal-400 font-semibold border-b-2 border-teal-400 pb-2">Inventario de IA</button>
      <button class="text-slate-500 hover:text-slate-300 pb-2 transition cursor-not-allowed">Empresas / Filiales (Pronto)</button>
    </div>

    <!-- Dashboard Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <!-- Stat Cards -->
      <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-6">
        <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-2">Modelos Registrados</h3>
        <p id="statTotalModels" class="text-4xl font-bold text-teal-400">0</p>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-6">
        <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-2">Riesgo Alto</h3>
        <p id="statHighRisk" class="text-4xl font-bold text-rose-400">0</p>
      </div>
      <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-6">
        <h3 class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-2">Filiales Activas</h3>
        <p id="statCompanies" class="text-4xl font-bold text-blue-400">0</p>
      </div>

      <!-- Inventory Table -->
      <div class="md:col-span-3 bg-slate-800/60 border border-slate-700/80 rounded-2xl p-6">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-lg font-bold">Inventario de IA</h2>
          <button id="openModalBtn" class="bg-teal-600 hover:bg-teal-500 text-white text-sm font-semibold py-2 px-4 rounded-lg transition">+ Nuevo Modelo</button>
        </div>
        
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-slate-700 text-sm text-slate-400">
                <th class="py-3 px-4">Modelo</th>
                <th class="py-3 px-4">Categoría</th>
                <th class="py-3 px-4">Proveedor</th>
                <th class="py-3 px-4">Riesgo</th>
                <th class="py-3 px-4">Estado</th>
              </tr>
            </thead>
            <tbody id="inventoryTableBody" class="text-sm">
              <tr>
                <td colspan="5" class="py-4 text-center text-slate-500">Cargando datos...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>

  <!-- Modal Nuevo Modelo -->
  <div id="newModelModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 w-full max-w-lg shadow-2xl">
      <h2 class="text-2xl font-bold mb-6 text-white">Registrar Nuevo Modelo de IA</h2>
      
      <form id="newModelForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold text-slate-300 mb-1">Nombre del Modelo</label>
          <input type="text" id="modelName" required placeholder="Ej. Gemini Pro" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white focus:border-teal-400 outline-none">
        </div>
        
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-semibold text-slate-300 mb-1">Categoría</label>
            <select id="modelCategory" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white outline-none">
              <option value="generativo">Generativo</option>
              <option value="predictivo">Predictivo</option>
              <option value="vision">Visión Artificial</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-semibold text-slate-300 mb-1">Nivel de Riesgo</label>
            <select id="modelRisk" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white outline-none">
              <option value="bajo">Bajo</option>
              <option value="medio">Medio</option>
              <option value="alto">Alto</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-sm font-semibold text-slate-300 mb-1">Filial / Empresa</label>
          <select id="modelCompany" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white outline-none">
            <option value="">Cargando empresas...</option>
          </select>
        </div>

        <div class="flex justify-end gap-3 mt-6">
          <button type="button" id="closeModalBtn" class="px-6 py-2 rounded-xl text-slate-300 hover:bg-slate-700 transition">Cancelar</button>
          <button type="submit" class="px-6 py-2 rounded-xl bg-teal-500 hover:bg-teal-400 text-slate-900 font-bold transition">Guardar Modelo</button>
        </div>
      </form>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
